# Профиль для локальной разработки.
#
# Наружу открыт только порт приложения. База и Redis слушают исключительно на
# 127.0.0.1: на машине разработчика они не должны быть видны из сети.

name: modern-machinery

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modern_machinery}
      POSTGRES_USER: ${POSTGRES_USER:-mm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm}
      # Ускоряет создание тестовых баз и не нужен на машине разработчика.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm} -d ${POSTGRES_DB:-modern_machinery}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: compose/local/Dockerfile
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://${POSTGRES_USER:-mm}:${POSTGRES_PASSWORD:-mm}@db:5432/${POSTGRES_DB:-modern_machinery}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      # Задачи уходят в очередь, а не выполняются внутри запроса: в compose
      # поднят настоящий worker, и проверять надо именно его.
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      # Код монтируется для горячей перезагрузки, окружение остаётся в образе.
      - .:/app
      - /app/.venv
      - media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: compose/local/Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel", "info", "--concurrency", "2"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://${POSTGRES_USER:-mm}:${POSTGRES_PASSWORD:-mm}@db:5432/${POSTGRES_DB:-modern_machinery}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
      - /app/.venv
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: compose/local/Dockerfile
    # Тот же путь, что и в production: иначе beat создаёт файл расписания
    # прямо в каталоге проекта от имени root.
    command:
      ["celery", "-A", "config", "beat", "--loglevel", "info",
       "-s", "/var/lib/celery/beat-schedule"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://${POSTGRES_USER:-mm}:${POSTGRES_PASSWORD:-mm}@db:5432/${POSTGRES_DB:-modern_machinery}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
      - /app/.venv
      - celery_beat:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  media:
  celery_beat:
