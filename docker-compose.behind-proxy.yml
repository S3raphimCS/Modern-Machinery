# Режим «за чужим обратным прокси».
#
# Применяется поверх production-профиля, когда порты 80 и 443 уже занимает
# другой сервер — например Caddy, который сам выпускает сертификаты.
# В этом режиме:
#   - наш nginx слушает только localhost и наружу не смотрит;
#   - certbot не нужен: TLS терминирует внешний прокси;
#   - статику и ограничение частоты заявок по-прежнему обслуживает наш nginx.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml -f docker-compose.behind-proxy.yml up -d

services:
  nginx:
    # Тег !override обязателен: без него compose добавляет порты к уже
    # объявленным, и nginx всё равно занял бы 80 и 443 — ровно то, из-за
    # чего этот режим и понадобился.
    ports: !override
      # Только петлевой интерфейс: снаружи порт недоступен, внешний прокси
      # обращается к нему с той же машины.
      - "127.0.0.1:${APP_BIND_PORT:-8080}:80"

  certbot:
    # Сертификатами занимается внешний прокси.
    profiles: ["disabled"]
