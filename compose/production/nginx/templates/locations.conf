# Общие маршруты сайта. Подключаются и в http-, и в https-блок, чтобы
# конфигурация не расходилась между режимами.

# Общий предел запроса. Формы заявок принимают до трёх файлов по 10 МБ,
# поэтому им предел поднят отдельно ниже: с 10 МБ здесь даже один файл по
# лимиту отсекался бы nginx раньше приложения, и посетитель видел бы
# страницу ошибки вместо формы.
client_max_body_size 2m;
charset utf-8;

gzip on;
gzip_types text/plain text/css application/json application/javascript
           image/svg+xml application/xml;
gzip_min_length 1024;

# Заголовки безопасности нужны только для статики: ответы приложения
# проставляет само Django, и на уровне server они дублировались бы.
location /static/ {
    alias /app/staticfiles/;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location /media/ {
    alias /app/media/;
    expires 7d;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

# Файлы, приложенные к заявкам. `internal` означает, что снаружи этот путь
# недоступен вовсе: nginx отдаёт файл только по X-Accel-Redirect от Django,
# то есть после проверки прав сотрудника.
location /protected-leads/ {
    internal;
    alias /app/private_media/;
}

location = /healthz/ {
    proxy_pass http://django;
    include /etc/nginx/proxy_params.conf;
    access_log off;
}

location /zayavka/ {
    client_max_body_size 40m;
    limit_req zone=leads burst=5 nodelay;
    proxy_pass http://django;
    include /etc/nginx/proxy_params.conf;
}

location /api/v1/leads/ {
    client_max_body_size 40m;
    limit_req zone=leads burst=5 nodelay;
    proxy_pass http://django;
    include /etc/nginx/proxy_params.conf;
}

location / {
    proxy_pass http://django;
    include /etc/nginx/proxy_params.conf;
}
