# Общая часть, не зависящая от наличия сертификата.

upstream django {
    server web:8000;
}

# Ограничение частоты запросов к формам заявок на уровне nginx —
# дополнительный рубеж поверх дросселирования в приложении.
limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;

# Кому можно верить на слово о протоколе.
#
# Заголовок X-Forwarded-Proto подделывается одной строкой в curl. Если верить
# ему от кого угодно, любой сможет объявить своё http-соединение защищённым и
# обойти принудительный переход на https. Поэтому заголовок принимается только
# от соседа по машине или по внутренней сети — то есть от обратного прокси,
# который стоит перед нами. Запросы из интернета приходят с публичных адресов
# и в этот список не попадают.
geo $from_trusted_proxy {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

# Протокол исходного запроса.
#
# Если перед нами стоит ещё один обратный прокси (Caddy, Traefik, балансировщик
# провайдера), он уже сообщил, что клиент пришёл по https. Подставлять здесь
# свой $scheme нельзя: внутри контейнера он всегда http, Django решит, что
# соединение незашифровано, и отправит браузер на https — где его встретит тот
# же прокси и передаст запрос обратно. Получится бесконечная переадресация.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default      $scheme;
    "~^1:(.+)$"  $1;
}
